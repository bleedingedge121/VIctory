name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p victory
      - name: Package
        shell: pwsh
        run: |
          $packageDir = "dist/victory-windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/victory.exe, README.md, LICENSE, victory.example.toml $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/victory-windows-x64.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/victory-windows-x64.zip --title "$env:GITHUB_REF_NAME" --generate-notes --verify-tag
