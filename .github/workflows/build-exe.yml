name: Build victory.exe

on:
  push:
    branches: [cloud-build-exe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build release executable
        run: cargo build --release -p victory --locked
      - name: Upload victory.exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows-release
          path: target/release/victory.exe
          if-no-files-found: error
          retention-days: 7
