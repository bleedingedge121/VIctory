name: NVIDIA test build
on:
  push:
    branches: [nvidia-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test -p victory-gpu --locked
      - run: cargo build --profile diag -p victory --features diagnostics --locked
      - uses: actions/upload-artifact@v4
        with:
          name: victory-nvidia-diag
          path: target/diag/victory.exe
          if-no-files-found: error
          retention-days: 7
